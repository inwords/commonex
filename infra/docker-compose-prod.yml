services:
  db:
    image: postgres:17-alpine3.24
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-network

  nest-backend-green:
    image: ${COMMONEX_BACKEND_IMAGE}
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER_NAME=${POSTGRES_USER_NAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA}
      - OPEN_EXCHANGE_RATES_API_ID=${OPEN_EXCHANGE_RATES_API_ID}
      - DEVTOOLS_SECRET=${DEVTOOLS_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "const http2=require('http2');const c=http2.connect('http://localhost:3001');c.on('error',()=>process.exit(1));const r=c.request({':path':'/health'});r.on('response',h=>{c.close();process.exit(h[':status']===200?0:1)});r.on('error',()=>{c.close();process.exit(1)});r.end();"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-network
      - app-network

  nest-backend-blue:
    image: ${COMMONEX_BACKEND_IMAGE}
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER_NAME=${POSTGRES_USER_NAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA}
      - OPEN_EXCHANGE_RATES_API_ID=${OPEN_EXCHANGE_RATES_API_ID}
      - DEVTOOLS_SECRET=${DEVTOOLS_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "const http2=require('http2');const c=http2.connect('http://localhost:3001');c.on('error',()=>process.exit(1));const r=c.request({':path':'/health'});r.on('response',h=>{c.close();process.exit(h[':status']===200?0:1)});r.on('error',()=>{c.close();process.exit(1)});r.end();"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-network
      - app-network

  next-web:
    image: ${COMMONEX_FRONTEND_IMAGE}
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  nginx:
    image: ${COMMONEX_NGINX_IMAGE}
    command:
      - sh
      - -ec
      - |
        set -eu
        template=/etc/nginx/nginx.conf
        output=/tmp/commonex-nginx.conf

        # Substitute only server names: nginx request variables and certificate paths stay literal.
        awk '
        function fail(message) {
            print "nginx environment configuration: " message > "/dev/stderr"
            exit 1
        }
        function validate(host, variable, count, labels, i) {
            if (length(host) > 253 || host !~ /^[A-Za-z0-9.-]+$$/)
                fail(variable " must contain DNS hostnames")
            count = split(host, labels, ".")
            for (i = 1; i <= count; i++) {
                if (length(labels[i]) < 1 || length(labels[i]) > 63 ||
                    labels[i] !~ /^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$$/)
                    fail(variable " must contain DNS hostnames")
            }
        }
        BEGIN {
            web = ENVIRON["COMMONEX_WEB_HOSTS"]
            sub(/^[[:space:]]+/, "", web)
            sub(/[[:space:]]+$$/, "", web)
            count = split(web, hosts, /[[:space:]]+/)
            if (web == "") fail("COMMONEX_WEB_HOSTS must contain DNS hostnames")
            web = ""
            for (i = 1; i <= count; i++) {
                validate(hosts[i], "COMMONEX_WEB_HOSTS")
                if (web_names[tolower(hosts[i])]) fail("duplicate web hostname")
                web_names[tolower(hosts[i])] = 1
                web = web (i == 1 ? "" : " ") hosts[i]
            }
            api = ENVIRON["COMMONEX_API_HOST"]
            grpc = ENVIRON["COMMONEX_GRPC_HOST"]
            grafana = ENVIRON["COMMONEX_GRAFANA_HOST"]
            validate(api, "COMMONEX_API_HOST")
            validate(grpc, "COMMONEX_GRPC_HOST")
            validate(grafana, "COMMONEX_GRAFANA_HOST")
            if (web_names[tolower(grpc)] || web_names[tolower(grafana)] ||
                tolower(api) == tolower(grpc) || tolower(api) == tolower(grafana) ||
                tolower(grpc) == tolower(grafana))
                fail("web/API, gRPC, and Grafana hostnames must be distinct")
            shared_api = web_names[tolower(api)]
        }
        { sub(/\r$$/, "") }
        /^    server \{$$/ { in_server = 1; block = ""; omit = 0 }
        {
            if ($$0 == "        server_name commonex.ru www.commonex.ru;")
                $$0 = "        server_name " web ";"
            else if ($$0 == "        server_name dev-api.commonex.ru;") {
                $$0 = "        server_name " api ";"
                omit = shared_api
            } else if ($$0 == "        server_name grpc.commonex.ru;")
                $$0 = "        server_name " grpc ";"
            else if ($$0 == "        server_name gf.commonex.ru;")
                $$0 = "        server_name " grafana ";"

            if (in_server) block = block $$0 "\n"
            else print
        }
        /^    }$$/ && in_server {
            if (!omit) printf "%s", block
            in_server = 0
        }
        ' "$$template" > "$$output"

        nginx -t -c "$$output"
        exec nginx -c "$$output" -g 'daemon off;'
    environment:
      COMMONEX_WEB_HOSTS: ${COMMONEX_WEB_HOSTS:-commonex.ru www.commonex.ru}
      COMMONEX_API_HOST: ${COMMONEX_API_HOST:-dev-api.commonex.ru}
      COMMONEX_GRPC_HOST: ${COMMONEX_GRPC_HOST:-grpc.commonex.ru}
      COMMONEX_GRAFANA_HOST: ${COMMONEX_GRAFANA_HOST:-gf.commonex.ru}
    deploy:
      resources:
        limits:
          memory: 150M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - /etc/commonex/ssl/certbot/live/commonex.ru:/etc/nginx/ssl/live/commonex.ru:ro
      - /etc/commonex/ssl/certbot/archive/commonex.ru:/etc/nginx/ssl/archive/commonex.ru:ro
      - /etc/commonex/www/certbot/:/var/www/certbot/:ro
      - /etc/commonex/www/assetlinks.json:/var/www/assetlinks.json:ro
      - /etc/commonex/www/apple-app-site-association:/var/www/apple-app-site-association:ro
    depends_on:
      nest-backend-green:
        condition: service_healthy
      nest-backend-blue:
        condition: service_healthy
      next-web:
        condition: service_healthy
    networks:
      - app-network

  otel-collector:
    image: ${COMMONEX_OTEL_COLLECTOR_IMAGE}
    container_name: otelcollector
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: [ "--config=/etc/otel-collector-config.yaml", "--feature-gates=+extension.healthcheck.useComponentStatus" ]
    environment:
      - GOMEMLIMIT=150MiB
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network
      - monitoring-network

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    container_name: victoriametrics
    deploy:
      resources:
        limits:
          memory: 600M
          cpus: '0.80'
        reservations:
          memory: 230M
    memswap_limit: 2048M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--storageDataPath=/victoria-metrics-data"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    networks:
      - monitoring-network

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.11.0
    container_name: victoriatraces
    deploy:
      resources:
        limits:
          memory: 600M
          cpus: '0.80'
        reservations:
          memory: 230M
    memswap_limit: 2048M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--storageDataPath=/victoria-traces-data"
      - "--otlpGRPCListenAddr=:4317"
      - "--otlpGRPC.tls=false"
    volumes:
      - victoriatraces_data:/victoria-traces-data
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    deploy:
      resources:
        limits:
          memory: 650M
          cpus: '0.80'
        reservations:
          memory: 250M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - victoriametrics
      - victoriatraces
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-https://gf.commonex.ru/}
      - GF_SERVER_PROTOCOL=http
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USER_NAME=${POSTGRES_USER_NAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - app-network
      - monitoring-network
      - db-network

volumes:
  postgres_data:
  victoriametrics_data:
  victoriatraces_data:
  grafana_data:

networks:
  db-network:
    internal: true
  app-network:
  monitoring-network:
    internal: true
