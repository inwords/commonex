receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    stream_stats: true
    collection_interval: 5s
    timeout: 5s
    api_version: "1.45"

  postgresql:
    endpoint: db:5432
    username: commonex_monitor
    password: ${env:POSTGRES_MONITOR_PASSWORD}
    databases: [ "${env:POSTGRES_DATABASE}" ]
    collection_interval: 30s
    tls:
      insecure: true
    metrics:
      postgresql.deadlocks:
        enabled: true
      postgresql.temp.io:
        enabled: true
      postgresql.temp_files:
        enabled: true
      postgresql.blks_hit:
        enabled: true
      postgresql.blks_read:
        enabled: true
      postgresql.sequential_scans:
        enabled: true
    events:
      db.server.query_sample:
        enabled: false
      db.server.top_query:
        enabled: false

  sqlquery/postgresql_health:
    driver: postgres
    datasource: "host=db port=5432 user=commonex_monitor sslmode=disable connect_timeout=5 application_name=commonex-monitor"
    collection_interval: 30s
    max_open_conn: 1
    queries:
      - sql: >-
          SELECT current_database() AS database, s.schemaname AS schema, s.relname AS table,
            s.autovacuum_count, s.autoanalyze_count,
            COALESCE(EXTRACT(EPOCH FROM s.last_autovacuum), 0) AS last_autovacuum_seconds,
            COALESCE(EXTRACT(EPOCH FROM s.last_autoanalyze), 0) AS last_autoanalyze_seconds,
            age(c.relfrozenxid) AS xid_age
          FROM pg_stat_user_tables s JOIN pg_class c ON c.oid = s.relid
        metrics:
          - metric_name: commonex.postgresql.autovacuum.count
            value_column: autovacuum_count
            data_type: sum
            monotonic: true
            aggregation: cumulative
            attribute_columns: [ database, schema, table ]
          - metric_name: commonex.postgresql.autoanalyze.count
            value_column: autoanalyze_count
            data_type: sum
            monotonic: true
            aggregation: cumulative
            attribute_columns: [ database, schema, table ]
          - metric_name: commonex.postgresql.last_autovacuum.seconds
            value_column: last_autovacuum_seconds
            value_type: double
            unit: s
            attribute_columns: [ database, schema, table ]
          - metric_name: commonex.postgresql.last_autoanalyze.seconds
            value_column: last_autoanalyze_seconds
            value_type: double
            unit: s
            attribute_columns: [ database, schema, table ]
          - metric_name: commonex.postgresql.xid.age
            value_column: xid_age
            attribute_columns: [ database, schema, table ]
      - sql: >-
          SELECT current_database() AS database,
            COUNT(*) FILTER (WHERE state = 'idle in transaction') AS idle_transactions,
            COUNT(*) FILTER (WHERE state = 'idle in transaction (aborted)') AS aborted_idle_transactions,
            COUNT(*) FILTER (WHERE xact_start IS NOT NULL) AS open_transactions,
            COUNT(*) FILTER (WHERE wait_event_type = 'Lock') AS lock_waiters,
            COALESCE(MAX(EXTRACT(EPOCH FROM clock_timestamp() - xact_start)), 0) AS oldest_transaction_seconds
          FROM pg_stat_activity
          WHERE datname = current_database() AND backend_type = 'client backend'
            AND pid <> pg_backend_pid()
        metrics:
          - metric_name: commonex.postgresql.transaction.idle
            value_column: idle_transactions
            attribute_columns: [ database ]
          - metric_name: commonex.postgresql.transaction.idle_aborted
            value_column: aborted_idle_transactions
            attribute_columns: [ database ]
          - metric_name: commonex.postgresql.transaction.open
            value_column: open_transactions
            attribute_columns: [ database ]
          - metric_name: commonex.postgresql.lock.waiters
            value_column: lock_waiters
            attribute_columns: [ database ]
          - metric_name: commonex.postgresql.transaction.oldest.seconds
            value_column: oldest_transaction_seconds
            value_type: double
            unit: s
            attribute_columns: [ database ]
      - sql: >-
          SELECT current_database() AS database, s.userid::text AS userid,
            s.queryid::text AS queryid, s.calls,
            s.total_exec_time / 1000.0 AS execution_seconds, s.rows,
            s.shared_blks_hit, s.shared_blks_read
          FROM public.pg_stat_statements(false) s
          WHERE s.dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
            AND s.toplevel AND s.queryid IS NOT NULL
            AND s.userid <> (SELECT oid FROM pg_roles WHERE rolname = current_user)
        metrics:
          - metric_name: commonex.postgresql.statement.calls
            value_column: calls
            data_type: sum
            monotonic: true
            aggregation: cumulative
            attribute_columns: [ database, userid, queryid ]
          - metric_name: commonex.postgresql.statement.execution.seconds
            value_column: execution_seconds
            value_type: double
            unit: s
            data_type: sum
            monotonic: true
            aggregation: cumulative
            attribute_columns: [ database, userid, queryid ]
          - metric_name: commonex.postgresql.statement.rows
            value_column: rows
            data_type: sum
            monotonic: true
            aggregation: cumulative
            attribute_columns: [ database, userid, queryid ]
          - metric_name: commonex.postgresql.statement.blocks.hit
            value_column: shared_blks_hit
            data_type: sum
            monotonic: true
            aggregation: cumulative
            attribute_columns: [ database, userid, queryid ]
          - metric_name: commonex.postgresql.statement.blocks.read
            value_column: shared_blks_read
            data_type: sum
            monotonic: true
            aggregation: cumulative
            attribute_columns: [ database, userid, queryid ]

  hostmetrics/postgresql_volume:
    collection_interval: 30s
    scrapers:
      filesystem:
        include_virtual_filesystems: true
        include_mount_points:
          mount_points: [ /var/lib/postgresql/data ]
          match_type: strict

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 70
    spike_limit_percentage: 15
  batch:

exporters:
  otlp_http/victoriametrics:
    compression: gzip
    encoding: proto
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
    tls:
      insecure: true
  otlp_grpc/victoriatraces:
    endpoint: victoriatraces:4317
    tls:
      insecure: true

connectors:
  span_metrics:
    dimensions:
      - name: http.route
    histogram:
      explicit:
        buckets: [0.05s, 0.1s, 0.25s, 0.5s, 1s, 2.5s, 5s, 10s, 15s]

extensions:
  health_check:
    http:
      endpoint: 127.0.0.1:13133
      status:
        enabled: true
        path: /

service:
  extensions: [ health_check ]
  pipelines:
    metrics:
      receivers: [ otlp, docker_stats, span_metrics, postgresql, sqlquery/postgresql_health, hostmetrics/postgresql_volume ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp_http/victoriametrics ]
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp_grpc/victoriatraces, span_metrics ]
