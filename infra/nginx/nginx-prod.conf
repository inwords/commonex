load_module modules/ngx_otel_module.so;

events {
    worker_connections 512;
}

http {
    # This is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    log_format showcase escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_connect_time":"$upstream_connect_time",'
            '"upstream_header_time":"$upstream_header_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"protocol":"$server_protocol",'
            '"http3":"$http3",'
            '"tls_protocol":"$ssl_protocol",'
            '"tls_cipher":"$ssl_cipher",'
            '"tls_curve":"$ssl_curve",'
            '"tls_sigalg":"$ssl_sigalg",'
            '"tls_client_sigalgs":"$ssl_sigalgs",'
            '"tls_early_data":"$ssl_early_data",'
            '"tls_session_reused":"$ssl_session_reused"'
        '}';
    access_log /var/log/nginx/access.log showcase;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    max_headers 200;

    upstream keepalive-nest-backend {
        zone nest_backend 64k;
        least_time header inflight;
        server nest-backend-green:3001 resolve max_fails=3 fail_timeout=30s;
        server nest-backend-blue:3001 resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream keepalive-next-web {
        zone next_web 64k;
        server next-web:4001 resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream grafana {
        zone grafana_backend 64k;
        server grafana:3000 resolve max_fails=3 fail_timeout=30s;
    }

    upstream keepalive-nest-backend-grpc {
        zone nest_backend_grpc 64k;
        least_time header inflight;
        server nest-backend-green:5000 resolve max_fails=3 fail_timeout=30s;
        server nest-backend-blue:5000 resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    otel_exporter {
        endpoint otelcollector:4317;
    }

    otel_trace on;
    otel_trace_context propagate;
    otel_service_name nginx-gateway;

    http2 on;
    http3 on;
    quic_retry on;
    quic_gso on;

    server_tokens off;

    ssl_protocols TLSv1.3;
    ssl_early_data on;
    ssl_certificate_compression on;

    ssl_certificate /etc/nginx/ssl/live/commonex.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/commonex.ru/privkey.pem;

    grpc_ssl_certificate /etc/nginx/ssl/live/commonex.ru/fullchain.pem;
    grpc_ssl_certificate_key /etc/nginx/ssl/live/commonex.ru/privkey.pem;

    add_header_inherit merge;

    # Security headers (inherited by all server blocks via add_header_inherit)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_comp_level 4;
    gzip_vary on;

    brotli on;
    brotli_static on;
    brotli_comp_level 4;

    server {
        listen 80;
        listen [::]:80;
        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name commonex.ru www.commonex.ru;

        gzip_min_length 1024;
        gzip_types text/plain text/css "text/javascript; charset=utf-8" font/woff2 application/json "application/json; charset=utf-8" application/javascript;
        brotli_min_length 1024;
        brotli_types text/plain text/css "text/javascript; charset=utf-8" font/woff2 application/json "application/json; charset=utf-8" application/javascript;

        add_header Alt-Svc 'h3=":443"; ma=86400';

        location /.well-known/assetlinks.json {
            default_type application/json;
            alias /var/www/assetlinks.json;
        }
        location /.well-known/apple-app-site-association {
            default_type application/json;
            alias /var/www/apple-app-site-association;
        }

        location /api/ {
            proxy_pass http://keepalive-nest-backend/;
            proxy_http_version 2;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://keepalive-next-web;
            proxy_http_version 2;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

    }

    server {
        listen 443 quic;
        listen [::]:443 quic;
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name dev-api.commonex.ru;

        gzip_min_length 512;
        gzip_types text/plain application/json "application/json; charset=utf-8";
        brotli_min_length 1024;
        brotli_types text/plain application/json "application/json; charset=utf-8";

        add_header Alt-Svc 'h3=":443"; ma=86400';

        location /api/ {
            proxy_pass http://keepalive-nest-backend/;
            proxy_http_version 2;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }

    server {
        listen 443 quic;
        listen [::]:443 quic;
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name gf.commonex.ru;

        gzip_min_length 1024;
        gzip_types text/plain text/css "text/javascript; charset=utf-8" font/woff2 application/json "application/json; charset=utf-8" application/javascript;
        brotli_min_length 1024;
        brotli_types text/plain text/css "text/javascript; charset=utf-8" font/woff2 application/json "application/json; charset=utf-8" application/javascript;

        add_header Alt-Svc 'h3=":443"; ma=86400';

        location /api/live/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_pass http://grafana;
        }

        location / {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name grpc.commonex.ru;

        location / {
            grpc_pass grpc://keepalive-nest-backend-grpc;
            grpc_set_header Connection "";
            grpc_set_header Host $host;
        }
    }
}
