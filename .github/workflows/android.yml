name: Mobile CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/**'

defaults:
  run:
    working-directory: ./android

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Retrieve the keystore and decode it to a file
        env:
          KEYSTORE_JKS_BASE64: ${{ secrets.KEYSTORE_JKS_BASE64 }}
        run: echo "$KEYSTORE_JKS_BASE64" | base64 --decode > ./app/keystore.jks

      - name: Build :app with Gradle
        run: ./gradlew --quiet testHostTest :app:test :app:assembleDebug :app:assembleRelease :app:bundleRelease -Pkover koverHtmlReport koverXmlReport --no-daemon --continue
        env:
          CI: true
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload R8 Configuration Analyzer report
        uses: actions/upload-artifact@v7
        with:
          name: R8 Configuration Analyzer Report
          path: ${{ github.workspace }}/android/app/build/outputs/mapping/release/configanalyzer.html
          if-no-files-found: error

      - name: Upload Kover coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: Kover Coverage Reports
          path: ${{ github.workspace }}/android/build/reports/kover/

      - name: Remove keystore file
        run: rm -f ./app/keystore.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Expenses APK Release Archive
          path: ${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Expenses AAB Release Archive
          path: ${{ github.workspace }}/android/app/build/outputs/bundle/release/app-release.aab

  ui_tests_android:
    uses: ./.github/workflows/android-ui-tests.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  build_ios:
    runs-on: macos-26
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build iosApp using Xcode
        run: xcodebuild -scheme iosApp -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.4.1' build
        working-directory: ./android/iosApp
