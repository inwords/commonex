name: Mobile Sentry Release

on:
  push:
    tags:
      - "release/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to process (release/YYYY-MM-N/P)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sentry_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install sentry-cli
        run: python -m pip install sentry-cli

      - name: Resolve release tag context
        id: release_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="$REF_NAME"
          fi

          if [[ ! "$TAG_NAME" =~ ^release/[0-9]{4}-[0-9]{2}-[0-9]+/[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            echo "Expected format: release/YYYY-MM-N/P" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "Tag not found in repository: $TAG_NAME" >&2
            exit 1
          fi

          TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Create Sentry release and deploy
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: >
          python android/scripts/sentry_release.py
          --android-build-file android/app/build.gradle.kts
          --tag "${{ steps.release_tag.outputs.tag_name }}"
          --current-sha "${{ steps.release_tag.outputs.tag_sha }}"
          --sentry-org inwords
          --sentry-project commonex
          --sentry-repo "${{ github.repository }}"
          --sentry-environment production
          --github-output "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          {
            echo "## Mobile Sentry release"
            echo "- Tag: \`${{ steps.release_tag.outputs.tag_name }}\`"
            echo "- Tag commit: \`${{ steps.release_tag.outputs.tag_sha }}\`"
            echo "- Sentry release: \`${{ steps.sentry.outputs.sentry_version }}\`"
            echo "- Commit mapping: \`${{ steps.sentry.outputs.commit_range }}\`"
            if [ -n "${{ steps.sentry.outputs.previous_release_tag }}" ]; then
              echo "- Previous release tag: \`${{ steps.sentry.outputs.previous_release_tag }}\`"
            else
              echo "- Previous release tag: none"
            fi
            echo "- Deploy environment: \`production\`"
          } >> "$GITHUB_STEP_SUMMARY"
