name: Android RuStore Publish

on:
  push:
    tags:
      - "release/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (release/YYYY-MM-N/P)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 1

      - name: Resolve release tag context
        id: release_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="$REF_NAME"
          fi

          if [[ ! "$TAG_NAME" =~ ^release/[0-9]{4}-[0-9]{2}-[0-9]+/[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            echo "Expected format: release/YYYY-MM-N/P" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "Tag not found in repository: $TAG_NAME" >&2
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        env:
          KEYSTORE_JKS_BASE64: ${{ secrets.KEYSTORE_JKS_BASE64 }}
        run: printf '%s' "$KEYSTORE_JKS_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build signed release bundle
        env:
          CI: "true"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./android/gradlew -p android --quiet :app:bundleRelease --no-daemon --no-configuration-cache

      - name: Remove release keystore
        if: always()
        run: rm -f android/app/keystore.jks

      - name: Validate RuStore Russian release notes
        run: >
          mkdir -p "$RUNNER_TEMP/rustore-release-bundle" &&
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/rustore-release-bundle/app-release.aab" &&
          python android/scripts/parse_release_notes.py
          --file android/release-notes/ru-RU.txt
          --max-length 5000
          > "$RUNNER_TEMP/rustore-release-bundle/whats-new.txt"

      - name: Upload RuStore bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: rustore-release-bundle
          path: ${{ runner.temp }}/rustore-release-bundle
          retention-days: 90

      - name: Write build summary
        run: |
          {
            echo "## RuStore build"
            echo "- Tag: \`${{ steps.release_tag.outputs.tag_name }}\`"
            echo "- Bundle artifact: \`rustore-release-bundle\`"
            echo "- Release notes file: \`android/release-notes/ru-RU.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: rustore-production
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.release_tag }}
          fetch-depth: 1

      - name: Checkout main tooling
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          path: tooling-main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve Android package name
        id: package
        run: >
          python tooling-main/android/scripts/release_version.py package-name
          --android-build-file android/app/build.gradle.kts
          --github-output "$GITHUB_OUTPUT"

      - name: Download RuStore bundle artifact
        uses: actions/download-artifact@v5
        with:
          name: rustore-release-bundle
          path: ${{ runner.temp }}/rustore-release-bundle

      - name: Debug RuStore key format
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import pathlib
          import subprocess
          import tempfile

          key_id = os.environ.get("RUSTORE_KEY_ID", "")
          private_key = os.environ.get("RUSTORE_PRIVATE_KEY", "")
          lines = private_key.splitlines()
          first_line = lines[0] if lines else "<empty>"
          last_line = lines[-1] if lines else "<empty>"

          print(f"rustore_key_id_len={len(key_id)}")
          print(f"rustore_key_id_stripped_len={len(key_id.strip())}")
          print(f"rustore_key_id_has_outer_whitespace={key_id != key_id.strip()}")
          print(f"rustore_key_id_has_spaces={' ' in key_id}")
          print(f"rustore_key_id_has_tabs={'\t' in key_id}")
          print(f"rustore_key_chars={len(private_key)}")
          print(f"rustore_key_lines={len(lines)}")
          print(f"contains_literal_backslash_n={'\\n' in private_key}")
          print(f"contains_cr={'\\r' in private_key}")
          print(f"starts_with_begin={first_line.startswith('-----BEGIN ')}")
          print(f"ends_with_end={last_line.startswith('-----END ')}")
          print(f"first_line={first_line!r}")
          print(f"last_line={last_line!r}")

          with tempfile.TemporaryDirectory(prefix="rustore-key-debug-") as temp_dir:
              key_path = pathlib.Path(temp_dir) / "key.pem"
              key_path.write_text(private_key, encoding="utf-8", newline="\n")
              check = subprocess.run(
                  ["openssl", "pkey", "-in", str(key_path), "-noout"],
                  capture_output=True,
                  text=True,
              )
              print(f"openssl_pkey_exit={check.returncode}")
              if check.returncode != 0:
                  stderr = (check.stderr or "").strip()
                  print(f"openssl_pkey_stderr={stderr!r}")

              message = f"{key_id.strip()}{dt.datetime.now(dt.timezone.utc).astimezone().isoformat(timespec='milliseconds')}"
              message_path = pathlib.Path(temp_dir) / "message.txt"
              signature_path = pathlib.Path(temp_dir) / "signature.bin"
              message_path.write_text(message, encoding="utf-8", newline="\n")

              sign = subprocess.run(
                  [
                      "openssl",
                      "dgst",
                      "-sha512",
                      "-sign",
                      str(key_path),
                      "-binary",
                      str(message_path),
                  ],
                  capture_output=True,
              )
              print(f"openssl_dgst_exit={sign.returncode}")
              if sign.returncode != 0:
                  stderr = sign.stderr.decode("utf-8", errors="replace").strip()
                  print(f"openssl_dgst_stderr={stderr!r}")
              else:
                  signature_path.write_bytes(sign.stdout)
                  b64 = subprocess.run(
                      ["openssl", "base64", "-A", "-in", str(signature_path)],
                      capture_output=True,
                      text=True,
                  )
                  print(f"openssl_base64_exit={b64.returncode}")
                  if b64.returncode != 0:
                      stderr = (b64.stderr or "").strip()
                      print(f"openssl_base64_stderr={stderr!r}")
                  else:
                      signature = (b64.stdout or "").strip()
                      print(f"local_signature_len={len(signature)}")
          PY

      - name: Publish to RuStore
        id: publish
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: |
          AAB_PATH="$RUNNER_TEMP/rustore-release-bundle/app-release.aab"
          WHATS_NEW_PATH="$RUNNER_TEMP/rustore-release-bundle/whats-new.txt"
          if [ ! -f "$AAB_PATH" ] || [ ! -f "$WHATS_NEW_PATH" ]; then
            echo "RuStore publish inputs are missing after artifact download." >&2
            exit 1
          fi
          set -o pipefail
          python tooling-main/android/scripts/rustore_publish.py \
            --key-id "$RUSTORE_KEY_ID" \
            --package-name "${{ steps.package.outputs.package_name }}" \
            --aab-path "$AAB_PATH" \
            --whats-new-file "$WHATS_NEW_PATH" \
            2>&1 | tee "$RUNNER_TEMP/rustore-publish.log"

      - name: Upload RuStore publish logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustore-publish-logs
          path: ${{ runner.temp }}/rustore-publish.log
          retention-days: 90

      - name: Write publish summary
        if: always()
        run: |
          {
            echo "## RuStore publish"
            echo "- Tag: \`${{ needs.build.outputs.release_tag }}\`"
            echo "- Environment: \`rustore-production\`"
            echo "- Result: \`${{ steps.publish.outcome }}\`"
            echo "- Manual fallback: RuStore Console publish flow if API submission fails."
          } >> "$GITHUB_STEP_SUMMARY"
