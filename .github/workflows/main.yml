name: Backend/Web CI/CD Pipeline

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Retained release Git SHA to activate
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'web/**'
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'web/**'
      - 'infra/**'
      - '.github/workflows/**'

jobs:
  containers_matrix_prep:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix-json.outputs.matrix }}
      has-services: ${{ steps.matrix-json.outputs.has-services }}
      has-infra-changes: ${{ steps.filter.outputs.infra }}
      changed-services: ${{ steps.matrix-json.outputs.changed-services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            backend: 'backend/**'
            frontend: 'web/**'
            otel-collector: 'infra/otel-collector/**'
            nginx: 'infra/nginx/**'
            infra: 'infra/**'

      - name: Prepare matrix JSON
        id: matrix-json
        run: |
          # 'filter.outputs.changes' contains a JSON array of changed service names, e.g. ["backend","frontend"].
          changed_services='${{ steps.filter.outputs.changes }}'

          # Define all available services in a JSON file
          cat <<EOF > services.json
          [
            {
              "name": "backend",
              "context": "./backend",
              "image_env": "COMMONEX_BACKEND_IMAGE",
              "repository": "ruggedbl/commonex-nest-backend"
            },
            {
              "name": "frontend",
              "context": "./web",
              "image_env": "COMMONEX_FRONTEND_IMAGE",
              "repository": "ruggedbl/commonex-next-web"
            },
            {
              "name": "otel-collector",
              "context": "./infra/otel-collector",
              "image_env": "COMMONEX_OTEL_COLLECTOR_IMAGE",
              "repository": "ruggedbl/opentelemetry-collector-custom"
            },
            {
              "name": "nginx",
              "context": "./infra/nginx",
              "image_env": "COMMONEX_NGINX_IMAGE",
              "repository": "ruggedbl/nginx-http3"
            }
          ]
          EOF

          matrix=$(jq -c --argjson changed_services "$changed_services" '
          [
          .[] | (.name) as $n | select($changed_services | index($n) != null)
          ]
          ' services.json)

          echo "matrix={\"service\":$matrix}" >> $GITHUB_OUTPUT
          echo "changed-services=$(echo "$matrix" | jq -c '[.[].name]')" >> $GITHUB_OUTPUT

          # Check if matrix has any services
          if [ "$(echo $matrix | jq 'length')" -gt 0 ]; then
            echo "has-services=true" >> $GITHUB_OUTPUT
          else
            echo "has-services=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: containers_matrix_prep
    if: |
      github.event_name != 'workflow_dispatch' &&
      needs.containers_matrix_prep.outputs.has-services == 'true'
    strategy:
      matrix: ${{ fromJson(needs.containers_matrix_prep.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ matrix.service.repository }}:latest
            ${{ matrix.service.repository }}:${{ github.sha }}

  infra-deploy-tests:
    runs-on: ubuntu-latest
    needs: containers_matrix_prep
    if: |
      github.event_name != 'workflow_dispatch' &&
      needs.containers_matrix_prep.outputs.has-infra-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test deployment wrapper
        run: python3 -m unittest discover -s infra/deploy -p 'test_*.py'

  deploy:
    environment: production
    concurrency:
      group: commonex-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [containers_matrix_prep, build-and-push, infra-deploy-tests]
    if: |
      always() &&
      github.event_name != 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (needs.infra-deploy-tests.result == 'success' || needs.infra-deploy-tests.result == 'skipped') &&
      (
        (needs.containers_matrix_prep.outputs.has-services == 'true' && needs.build-and-push.result == 'success') ||
        (needs.containers_matrix_prep.outputs.has-infra-changes == 'true' && needs.build-and-push.result == 'skipped')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          install -m 600 infra/deploy/known_hosts ~/.ssh/known_hosts
          printf '%s\n' \
            'Host commonex-production' \
            '    HostName ${{ secrets.SERVER_IP }}' \
            '    User commonex-deploy' \
            '    IdentityFile ~/.ssh/id_ed25519' \
            '    IdentitiesOnly yes' \
            '    HostKeyAlias commonex-production' \
            '    StrictHostKeyChecking yes' \
            '    UserKnownHostsFile ~/.ssh/known_hosts' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Resolve immutable release images
        env:
          CHANGED_SERVICES: ${{ needs.containers_matrix_prep.outputs.changed-services }}
        run: |
          current_images_status=0
          ssh commonex-production "current-images" \
            > current-images.env 2> current-images.err || current_images_status=$?

          resolver_arguments=("$CHANGED_SERVICES" "$GITHUB_SHA")
          if [ "$current_images_status" -eq 0 ]; then
            resolver_arguments+=("current-images.env")
          elif printf '%s\n' \
            'commonex-deploy: no immutable activation history exists; bootstrap required' \
            | cmp -s - current-images.err; then
            rm -f current-images.env current-images.err
          else
            echo "Unable to read the active immutable image references." >&2
            exit "$current_images_status"
          fi

          python3 infra/deploy/resolve_release_images.py \
            "${resolver_arguments[@]}" > release-images.env

      - name: Prepare validated release archive
        run: |
          install -d release
          install -m 644 infra/docker-compose-prod.yml release/docker-compose-prod.yml
          install -m 600 /dev/null release/.env
          cat >> release/.env << 'ENVEOF'
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER_NAME=${{ secrets.POSTGRES_USER_NAME }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DATABASE=${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_SCHEMA=${{ secrets.POSTGRES_SCHEMA }}
          OPEN_EXCHANGE_RATES_API_ID=${{ secrets.OPEN_EXCHANGE_RATES_API_ID }}
          DEVTOOLS_SECRET=${{ secrets.DEVTOOLS_SECRET }}
          GF_SECURITY_ADMIN_USER=${{ secrets.GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
          ENVEOF
          cat release-images.env >> release/.env
          tar -C release -czf commonex-release.tar.gz docker-compose-prod.yml .env

      - name: Stage, validate, and deploy release
        run: |
          ssh commonex-production "stage $GITHUB_SHA" < commonex-release.tar.gz
          ssh commonex-production "validate $GITHUB_SHA"
          ssh commonex-production "deploy $GITHUB_SHA $GITHUB_RUN_NUMBER"

  rollback:
    if: github.event_name == 'workflow_dispatch'
    environment: production
    concurrency:
      group: commonex-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          install -m 600 infra/deploy/known_hosts ~/.ssh/known_hosts
          printf '%s\n' \
            'Host commonex-production' \
            '    HostName ${{ secrets.SERVER_IP }}' \
            '    User commonex-deploy' \
            '    IdentityFile ~/.ssh/id_ed25519' \
            '    IdentitiesOnly yes' \
            '    HostKeyAlias commonex-production' \
            '    StrictHostKeyChecking yes' \
            '    UserKnownHostsFile ~/.ssh/known_hosts' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Activate retained release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a lowercase 40-character Git SHA" >&2
            exit 1
          fi
          ssh commonex-production "rollback $RELEASE_SHA $GITHUB_RUN_NUMBER"
